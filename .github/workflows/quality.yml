name: Quality maintenance

on:
  # PR/main enforcement remains in the existing publication workflow's test job.
  schedule:
    - cron: "57 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
  queue: max

jobs:
  npm-dependencies:
    name: Known npm vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm run check:dependencies

  workflows:
    name: Workflow policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.tools.sum
      - run: go mod download -modfile=go.tools.mod
      - run: go run ./tools/check.go workflows

  vulnerabilities:
    name: Reachable Go vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: addon-dnd-character-sheets
    steps:
      - uses: actions/checkout@v7
        with:
          path: addon-dnd-character-sheets
      - uses: actions/setup-go@v7
        with:
          go-version-file: addon-dnd-character-sheets/go.mod
          cache-dependency-path: |
            addon-dnd-character-sheets/go.sum
            addon-dnd-character-sheets/go.tools.sum
            addon-dnd-character-sheets/host-sdk-revision.txt
            addon-dnd-character-sheets/engine-model-revision.txt
      - name: Resolve immutable native build dependencies
        id: dependencies
        shell: bash
        run: |
          host_sdk=$(go run ./tools/check.go dependency-ref host-sdk-revision.txt)
          printf 'host_sdk=%s\n' "$host_sdk" >> "$GITHUB_OUTPUT"
          engine_model=$(go run ./tools/check.go dependency-ref engine-model-revision.txt)
          printf 'engine_model=%s\n' "$engine_model" >> "$GITHUB_OUTPUT"
        working-directory: addon-dnd-character-sheets
      - uses: actions/checkout@v7
        with:
          repository: pjunak/ttrpg-codex
          ref: ${{ steps.dependencies.outputs.host_sdk }}
          path: ttrpg-codex
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: pjunak/addon-dnd-engine
          ref: ${{ steps.dependencies.outputs.engine_model }}
          path: addon-dnd-engine
          persist-credentials: false
      - run: go mod download -modfile=go.tools.mod
      - run: go run ./tools/check.go vuln
